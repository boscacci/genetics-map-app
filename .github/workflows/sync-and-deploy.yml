name: Sync and Deploy

# Promote Working Copy → Production, export to CSV, encrypt, build, deploy.
# Sheet is the primary source of truth.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: genetics-map-sheet-publish
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag targets current main with successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Release tag must point to the current main commit." >&2
            exit 1
          fi
          successful_runs=$(gh run list --workflow CI --commit "$GITHUB_SHA" --branch main --event push --status success --limit 1 --json databaseId --jq 'length')
          if [ "$successful_runs" -ne 1 ]; then
            echo "Release commit does not have a successful main CI run." >&2
            exit 1
          fi

  sync-and-deploy:
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    environment:
      name: production
      url: https://boscacci.github.io/genetics-map-app/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate secret hash for App.tsx
        run: node scripts/hash-secret.js
        env:
          REACT_APP_SECRET_KEY: ${{ secrets.REACT_APP_SECRET_KEY }}

      - name: Update secret hash in App.tsx
        run: |
          HASH=$(grep REACT_APP_SECRET_HASH .env.generated | cut -d'=' -f2)
          sed -i "s|const SECRET_HASH = \"[a-f0-9]*\";|const SECRET_HASH = \"$HASH\";|" src/App.tsx

      - name: Run script tests
        run: npm run test:scripts

      - name: Run React component tests
        run: CI=true npm test -- --watchAll=false

      - name: Type-check app
        run: npx tsc --noEmit

      - name: Build app preflight
        run: GENERATE_SOURCEMAP=false ./node_modules/.bin/react-scripts build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest -q tests

      - name: Create GCP credentials
        run: |
          mkdir -p .gcp-credentials
          echo '${{ secrets.GCP_SA_KEY }}' | base64 -d > .gcp-credentials/genetics-map-sa-key.json
          echo '${{ secrets.SHEET_ID }}' > .gcp-credentials/sheet-id.txt
          if [ -n "${{ secrets.GEOCODING_API_KEY }}" ]; then
            echo '${{ secrets.GEOCODING_API_KEY }}' > .gcp-credentials/geocoding-api-key.txt
          fi

      - name: Validate Working Copy structure (read-only)
        run: npm run validate:promotion

      - name: Geocode Working Copy (fill missing lat/lng)
        run: python scripts/geocode_working_copy.py

      - name: Promote Working Copy → Production
        run: npm run promote

      - name: Clean and validate Production (pandas, writes back to Sheet)
        run: python scripts/clean_and_validate.py --output-stdout > /tmp/cleaned.csv

      - name: Check Sheet publish health
        run: npm run check:sheet-health -- --require-sync --github-summary

      - name: Backup Production (separate sheets in Drive folder)
        run: node scripts/backup-production.js
        env:
          BACKUP_FOLDER_ID: ${{ secrets.BACKUP_FOLDER_ID }}

      - name: Encrypt data (from Production via clean script output)
        run: |
          mkdir -p data
          cp /tmp/cleaned.csv data/data.csv
          npm run encrypt-data
        env:
          REACT_APP_SECRET_KEY: ${{ secrets.REACT_APP_SECRET_KEY }}

      - name: Build app
        env:
          REACT_APP_CARTO_BASEMAP_API_KEY: ${{ secrets.CARTO_BASEMAP_API_KEY }}
        run: |
          if [ -z "$REACT_APP_CARTO_BASEMAP_API_KEY" ]; then
            echo "CARTO_BASEMAP_API_KEY is required for production map builds." >&2
            exit 1
          fi
          GENERATE_SOURCEMAP=false ./node_modules/.bin/dotenv -e .env.generated -- ./node_modules/.bin/react-scripts build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages

  notify-failure:
    needs: [validate-release, sync-and-deploy]
    if: ${{ always() && (needs.validate-release.result == 'failure' || needs.sync-and-deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notification helper
        uses: actions/checkout@v4

      - name: Capture completed failed job logs
        run: bash .github/scripts/capture-failure-log.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ Genetics Map: Sync and Deploy failed"
          body: |
            Sync and Deploy workflow failed.

            Repository: ${{ github.repository }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The attached log starts with a failed-job summary and then includes the last 1000 lines from each completed failed upstream job.
          to: boscacci.data@gmail.com
          from: Genetics Map Bot <${{ secrets.SMTP_USERNAME }}>
          attachments: failure-log.txt
